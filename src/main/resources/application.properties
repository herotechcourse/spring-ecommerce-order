spring.application.name=spring-ecommerce

server.port=80

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.datasource.url=jdbc:h2:mem:database
spring.datasource.username=${SPRING_DATASOURCE_PROD_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PROD_PASSWORD}

logging.level.root=warn

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false


security.jwt.token.secret-key=${TOKEN_SECRET_KEY}
security.jwt.token.expire-length=${TOKEN_EXPIRE_LENGTH}
stripe.secret-key=${STRIPE_SECRET_KEY}
stripe.create-payment-intent-url=https://api.stripe.com/v1/payment_intents
